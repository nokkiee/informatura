      <stop offset="0" stop-color="#191c21"/>
      <stop offset="1" stop-color="#101215"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dde2"/>
      <stop offset="1" stop-color="#b3b9c1"/>
