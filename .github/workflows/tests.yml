name: Testy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: pdftotext for the audit against the original PDFs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm ci
      - run: npm test
      - run: npm run verify-content
      - name: End-to-end tests (Python, C++ and Java code, SQL, spreadsheet, all 175 tasks)
        run: xvfb-run -a npm run test:e2e

  windows:
    # The app on real Windows with the toolchains a student would install.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: C++ compiler (MinGW)
        shell: pwsh
        run: |
          # Not added to PATH on purpose: the app should find MinGW in its usual folder by itself.
          if (-not (Get-Command g++ -ErrorAction SilentlyContinue)) { choco install mingw -y --no-progress }
      - run: npm ci
      - run: npm test
      - run: npm run verify-content
      - name: End-to-end tests
        run: npm run test:e2e
