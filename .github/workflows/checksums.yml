name: Sumy kontrolne

# Adds SHA256SUMS.txt to a release when it is published: the SHA-256 of every file in the
# release, computed from the files themselves. Can also be run by hand for an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag wydania, np. v1.3.1
        required: true

permissions:
  contents: write

jobs:
  sums:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download the release files
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files --pattern '*.exe' --pattern '*.AppImage' --pattern '*.deb'
      - name: Compute SHA256SUMS.txt
        run: |
          cd files
          ls -la
          sha256sum -- * | sort -k2 > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - name: Attach it to the release
        run: gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
